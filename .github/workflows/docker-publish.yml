name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Reject stale production commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_revision="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          if [ "$current_revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::A newer production commit exists; this run must not publish or deploy an older release"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Kitsunet over Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:kitsunet-deploy
          ping: 192.168.1.5
          version: 1.94.2

      - name: Deploy to Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_URL: http://192.168.1.5:8000
          COOLIFY_SERVICE_UUID: "phuqqlowdgswkozuw6do57z9"
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID&force=false")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy request failed (HTTP $status)"
            exit 1
          fi
          if ! jq --exit-status --arg uuid "$COOLIFY_SERVICE_UUID" '
            .deployments | length == 1 and
            .[0].resource_uuid == $uuid and
            (.[0].message | startswith("Service ") and
              endswith(" started. It could take a while, be patient."))
          ' "$response_file" >/dev/null 2>&1; then
            echo "::error::Coolify did not confirm a start request for the expected service"
            exit 1
          fi
          echo "Coolify accepted deployment request for commit $GITHUB_SHA"

      - name: Verify the deployed release
        timeout-minutes: 12
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          RELEASE_URLS: |
            https://autofill.kitsunezu.com/health
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            ready=true
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "$url?revision=$EXPECTED_REVISION&attempt=$SECONDS" \
                | jq --exit-status --arg revision "$EXPECTED_REVISION" '
                  .revision == $revision and .ok != false and
                  .status != "degraded" and .model_loaded != false and .db_connected != false
                ' >/dev/null 2>&1; then
                ready=false
                break
              fi
            done <<< "$RELEASE_URLS"
            if [ "$ready" = true ]; then
              echo "Public endpoints are healthy and serve revision $EXPECTED_REVISION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The expected release did not become healthy within 10 minutes"
          exit 1
