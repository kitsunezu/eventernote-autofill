services:
  eventernote-autofill:
    image: ghcr.io/kitsunezu/eventernote-autofill:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3004:8790"
    environment:
      - PORT=8790
      - APP_TOKEN_ENABLED=${APP_TOKEN_ENABLED:-true}
      - APP_TOKEN=${APP_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      - EVENTERNOTE_ORIGIN=https://www.eventernote.com
      - EVENTERNOTE_USERNAME=${EVENTERNOTE_USERNAME:-}
      - EVENTERNOTE_PASSWORD=${EVENTERNOTE_PASSWORD:-}
      - EVENTERNOTE_WRITE_ENABLED=${EVENTERNOTE_WRITE_ENABLED:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
